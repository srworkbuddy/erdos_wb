<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy · 周报生成与乐享归档演示</title>
<style>
/* ============ WorkBuddy 设计令牌（从 createskill_demo 源码提取） ============ */
:root{
    --wb-brand:#3B5BFE; --wb-text:#1A1A1A; --wb-sub:#8A8F99;
    --wb-border:#ECEEF1; --wb-bg:#F5F6F8; --wb-chat:#FFFFFF;
    --wb-sidebar:#FAFAFA; --wb-userBubble:#EBE9F8;
    --wb-success:#10B981; --wb-brandLight:#E8EDFF;
    --shadow-bubble:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
    --shadow-soft:0 1px 2px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.04);
    --shadow-card:0 4px 16px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
    background:var(--wb-bg);color:var(--wb-text);
    overflow:hidden;font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
.app{height:100vh;width:100vw;display:flex;flex-direction:column;background:var(--wb-bg)}

/* ============ 顶部 Header ============ */
.app-header{
    height:48px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--wb-border);
    display:flex;align-items:center;padding:0 16px;gap:12px;
    box-shadow:var(--shadow-soft);position:relative;z-index:10;
}
.hdr-brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand-logo{
    width:24px;height:24px;border-radius:6px;
    background:linear-gradient(135deg,#3B6FE0,#2C5BD2);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;
}
.brand-name{font-size:13px;font-weight:600;color:var(--wb-text);line-height:1.2}
.hdr-sep{color:var(--wb-border);margin:0 4px;font-size:14px}
.hdr-demo{font-size:12.5px;color:var(--wb-sub)}
.hdr-steps{display:flex;align-items:center;gap:4px;flex-shrink:0}
.step-pill{
    display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-size:12px;color:var(--wb-sub);transition:all .2s;cursor:pointer;white-space:nowrap;
}
.step-pill:hover{background:var(--wb-bg)}
.step-pill.done{color:var(--wb-success)}
.step-pill.cur{background:var(--wb-brandLight);color:var(--wb-brand);font-weight:500}
.step-dot{
    width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;background:var(--wb-bg);color:var(--wb-sub);flex-shrink:0;
}
.step-pill.done .step-dot{background:rgba(16,185,129,.15);color:var(--wb-success)}
.step-pill.cur .step-dot{background:var(--wb-brand);color:#fff}
.hdr-progress{flex:1;min-width:60px;display:flex;align-items:center;gap:8px}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--wb-bg);overflow:hidden}
.pbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--wb-brand),#818CF8);transition:width .4s ease-out}
.pnum{font-size:11.5px;color:var(--wb-sub);font-family:ui-monospace,Menlo,monospace;flex-shrink:0}
.hdr-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-ctrl{
    height:32px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:8px;
    font-size:12.5px;font-weight:500;transition:all .15s;
}
.btn-ctrl:disabled{opacity:.4;cursor:not-allowed}
.btn-play{background:var(--wb-bg);color:var(--wb-text)}
.btn-play:not(:disabled):hover{background:#EBEBEF}
.btn-play.playing{background:var(--wb-brand);color:#fff}
.btn-play.playing:not(:disabled):hover{opacity:.9}
.btn-next{background:var(--wb-brand);color:#fff}
.btn-next:not(:disabled):hover{opacity:.9}
.btn-reset{width:32px;height:32px;border-radius:8px;color:var(--wb-sub);display:flex;align-items:center;justify-content:center;font-size:16px}
.btn-reset:not(:disabled):hover{background:var(--wb-bg);color:var(--wb-text)}

/* ============ 主体 ============ */
.app-body{flex:1;min-height:0;display:flex}

/* ============ 左侧边栏 ============ */
.sidebar{
    height:100%;width:208px;flex-shrink:0;background:#fff;
    border-right:1px solid var(--wb-border);display:flex;flex-direction:column;
    font-size:13px;color:var(--wb-text);user-select:none;
}
.sb-top{display:flex;align-items:center;padding:10px 12px 4px}
.sb-lights{display:flex;gap:4px}
.sb-lights span{width:10px;height:10px;border-radius:50%}
.sb-lights .l1{background:#FF5F57}.sb-lights .l2{background:#FEBC2E}.sb-lights .l3{background:#28C840}
.sb-spacer{flex:1}
.sb-icons{display:flex;gap:2px}
.sb-icons button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--wb-sub);border-radius:5px;font-size:13px}
.sb-icons button:hover{color:var(--wb-text);background:var(--wb-bg)}
.sb-ver{padding:0 12px 8px;font-size:11px;color:var(--wb-sub)}
.sb-nav{padding:0 8px 8px;display:flex;flex-direction:column;gap:1px}
.sb-nav-item{
    width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
    color:var(--wb-text);text-align:left;transition:background .15s;font-size:13px;
}
.sb-nav-item:hover{background:var(--wb-bg)}
.sb-nav-item .ni{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--wb-sub);flex-shrink:0}
.sb-nav-item .nl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-nav-item .beta{
    margin-left:auto;font-size:9px;line-height:1;padding:2px 6px;border-radius:4px;
    background:var(--wb-bg);color:var(--wb-sub);border:1px solid var(--wb-border);flex-shrink:0;
}
.sb-nav-item .hint{margin-left:auto;font-size:10px;color:rgba(138,143,153,.8);flex-shrink:0}
.sb-chats{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px}
.sb-chat{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
    transition:all .15s;cursor:pointer;
}
.sb-chat:hover{background:var(--wb-bg)}
.sb-chat.cur{background:var(--wb-brandLight);border-left:2px solid var(--wb-brand)}
.sb-chat .cd{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--wb-success)}
.sb-chat.cur .cd{background:var(--wb-brand)}
.sb-chat .ct{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-chat.cur .ct{color:var(--wb-brand);font-weight:500}
.sb-chat .cm{font-size:10.5px;color:var(--wb-sub);flex-shrink:0}
.sb-bottom{border-top:1px solid var(--wb-border);padding:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sb-bot-btn{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--wb-text)}
.sb-bot-btn:hover{background:var(--wb-bg)}
.sb-bot-btn.green{background:#10B981;color:#fff;font-weight:500;font-size:11px;padding:4px 8px}
.sb-bot-btn.green:hover{opacity:.9}

/* ============ 聊天主区 ============ */
.chat-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--wb-chat);position:relative}
.chat-hdr{
    height:44px;flex-shrink:0;background:var(--wb-sidebar);border-bottom:1px solid var(--wb-border);
    display:flex;align-items:center;gap:8px;padding:0 16px;
}
.chat-hdr .dots{display:flex;gap:3px;align-items:center;flex-shrink:0}
.chat-hdr .dots span{
    display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11.5px;
    color:var(--wb-sub);white-space:nowrap;
}
.chat-hdr .dots span.on{background:#fff;color:var(--wb-text);box-shadow:var(--shadow-soft);font-weight:500}
.chat-hdr .c-sub{font-size:11px;color:var(--wb-sub);margin-left:auto;flex-shrink:0}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 12px;scroll-behavior:smooth}
.chat-scroll::-webkit-scrollbar{width:5px}
.chat-scroll::-webkit-scrollbar-thumb{background:#D8DADE;border-radius:3px}
.msg-list{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ============ 欢迎主页（截图真实样式） ============ */
.welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px 40px;position:relative;overflow-y:auto;
}
.welcome-title{
    font-size:36px;color:var(--wb-text);margin-bottom:32px;letter-spacing:-0.5px;
    line-height:1.2;
}
.welcome-title .wb-name{font-weight:700}
.welcome-title .wb-comma{font-weight:500;color:var(--wb-text);margin:0 1px}
.welcome-title .wb-rest{font-weight:500;color:var(--wb-text)}
.welcome-tabs{
    display:flex;gap:4px;margin-bottom:28px;background:var(--wb-bg);
    padding:4px;border-radius:99px;border:1px solid var(--wb-border);
}
.w-tab{
    padding:7px 22px;border-radius:99px;font-size:14px;color:var(--wb-sub);
    display:flex;align-items:center;gap:6px;transition:all .15s;cursor:pointer;
}
.w-tab:hover{color:var(--wb-text)}
.w-tab.active{background:#fff;color:var(--wb-text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.w-tab-dot{width:6px;height:6px;border-radius:50%;background:var(--wb-text)}
.welcome-cards{
    display:flex;gap:24px;flex-wrap:wrap;justify-content:center;
    max-width:780px;margin-bottom:36px;
}
.w-card{
    display:flex;align-items:center;gap:6px;padding:0;
    font-size:13.5px;cursor:pointer;color:var(--wb-text);
}
.w-card:hover{color:var(--wb-brand)}
.w-card-icon{font-size:15px;display:inline-flex;align-items:center}
.welcome-input-wrap{width:100%;max-width:780px}
.welcome-input{
    display:flex;align-items:center;gap:4px;
    border:1px solid var(--wb-border);border-radius:16px;
    padding:14px 16px;background:#fff;transition:all .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.welcome-input.focus{border-color:var(--wb-brand);box-shadow:0 0 0 3px rgba(59,91,254,.08)}
.wi-tool{
    display:flex;align-items:center;gap:4px;color:var(--wb-sub);
    font-size:13.5px;cursor:pointer;padding:5px 8px;border-radius:8px;
    background:transparent;border:none;transition:all .15s;white-space:nowrap;
}
.wi-tool:hover{background:var(--wb-bg);color:var(--wb-text)}
.wi-text{color:rgba(26,26,26,.85);font-size:13.5px;padding:5px 8px;cursor:text}
.wi-sep{color:rgba(138,143,153,.25);font-weight:300;padding:0 2px}
.welcome-input-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.welcome-mcp{font-size:13px;color:var(--wb-brand);padding:4px 6px;cursor:pointer}
.welcome-model{font-size:13px;color:var(--wb-sub);padding:4px 6px;cursor:pointer}
.welcome-send{
    width:36px;height:36px;border-radius:50%;background:#1A1A1A;color:#fff;
    border:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:all .15s;font-size:15px;
}
.welcome-send:hover{background:#2d2d44;transform:scale(1.05)}
.welcome-send:disabled{background:#D1D5DB;cursor:not-allowed;transform:none}
.welcome-input-footer{
    display:flex;align-items:center;gap:24px;
    margin-top:12px;padding:0 4px;
    justify-content:center;font-size:12.5px;color:var(--wb-sub);
}
.welcome-fbtn{display:flex;align-items:center;gap:6px;cursor:pointer}
.welcome-fbtn:hover{color:var(--wb-text)}
.wi-radio{width:12px;height:12px;border:1.5px solid #C0C0C5;border-radius:50%;display:inline-block}
.wi-check{width:12px;height:12px;border:1.5px solid #C0C0C5;border-radius:3px;display:inline-block}
.typing-cursor{
    display:inline-block;width:2px;height:14px;background:var(--wb-brand);
    margin-left:2px;animation:blink .7s infinite step-end;vertical-align:middle;
}
@keyframes blink{50%{opacity:0}}

/* ============ 用户消息 ============ */
.msg-user{display:flex;justify-content:flex-end;animation:msgIn .32s ease-out}
@keyframes msgIn{from{opacity:0;transform:translate(10px,8px)}to{opacity:1;transform:translate(0,0)}}
.msg-user .u-bubble{
    max-width:78%;border-radius:16px 16px 4px 16px;background:var(--wb-userBubble);
    color:var(--wb-text);padding:10px 14px;font-size:14px;line-height:1.6;
    box-shadow:var(--shadow-bubble);white-space:pre-wrap;word-break:break-word;
}
.msg-user .u-share{
    max-width:78%;border-radius:16px 16px 4px 16px;background:var(--wb-userBubble);
    padding:12px 14px;box-shadow:var(--shadow-bubble);animation:msgIn .32s ease-out;
}
.u-share-row{display:flex;align-items:flex-start;gap:10px}
.u-share-icon{
    width:36px;height:36px;border-radius:8px;background:#fff;border:1px solid var(--wb-border);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.u-share-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.u-share-meta{font-size:12px;color:var(--wb-sub);margin-top:2px}
.u-share-status{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px}
.u-share-status.ok{color:var(--wb-success)}

/* ============ AI 消息 ============ */
.msg-ai{display:flex;flex-direction:column;align-items:flex-start;gap:0;animation:msgIn .32s ease-out}
.ai-typing{display:flex;align-items:center;gap:6px;padding:6px 2px}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--wb-sub);animation:tb 1.1s infinite ease-in-out}
.ai-typing span:nth-child(2){animation-delay:.18s}
.ai-typing span:nth-child(3){animation-delay:.36s}
@keyframes tb{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* skillBadge */
.ai-badge{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-radius:99px;
    background:rgba(59,91,254,.1);color:var(--wb-brand);border:1px solid rgba(59,91,254,.25);
    padding:4px 10px;font-size:12px;font-weight:500;margin-bottom:8px;
    animation:msgIn .3s ease-out .1s both;
}
.ai-badge .bp{position:relative;display:flex;width:7px;height:7px}
.ai-badge .bp::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--wb-brand);position:absolute;inset:0}
.ai-badge .bp::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(59,91,254,.4);animation:ping 1.6s infinite ease-out}
@keyframes ping{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(1.9);opacity:0}}

/* stages */
.stage-card{
    width:100%;border-radius:10px;border:1px solid var(--wb-border);background:#FBFCFE;
    overflow:hidden;margin-bottom:8px;animation:msgIn .3s ease-out both;
}
.stage-head{
    width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;text-align:left;
    transition:background .15s;cursor:pointer;
}
.stage-head:hover{background:rgba(232,237,255,.4)}
.stage-arrow{width:14px;height:14px;color:var(--wb-sub);transition:transform .2s;flex-shrink:0;font-size:10px;display:flex;align-items:center;justify-content:center}
.stage-card.open .stage-arrow{transform:rotate(90deg)}
.stage-title{font-size:13px;color:var(--wb-text);font-weight:500}
.stage-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.stage-live{width:6px;height:6px;border-radius:50%;background:var(--wb-success);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stage-body{max-height:0;overflow:hidden;transition:max-height .25s ease-in-out,opacity .25s;opacity:0}
.stage-card.open .stage-body{max-height:400px;opacity:1}
.stage-body-inner{
    padding:2px 14px 12px;font-size:12.5px;line-height:1.65;color:var(--wb-sub);
    white-space:pre-line;border-top:1px solid rgba(236,238,241,.6);
}
.stage-body-inner code{background:var(--wb-bg);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--wb-text)}

/* AI 正文 */
.ai-bubble{
    max-width:100%;border-radius:16px 16px 16px 4px;background:#fff;
    padding:10px 14px;box-shadow:var(--shadow-bubble);border:1px solid rgba(236,238,241,.5);
    font-size:14px;line-height:1.75;word-break:break-word;
}
.md h3{font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--wb-text)}
.md h3:first-child{margin-top:0}
.md p{margin:6px 0}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md strong{font-weight:600;color:var(--wb-text)}
.md code{background:var(--wb-bg);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--wb-brand)}
.md table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.md th{background:var(--wb-bg);font-weight:600;text-align:left}
.md th,.md td{border:1px solid var(--wb-border);padding:6px 8px}
.md td{color:var(--wb-text)}
.md a{color:var(--wb-brand);text-decoration:none}.md a:hover{text-decoration:underline}

/* products */
.prod-card{
    display:flex;align-items:center;gap:12px;width:100%;max-width:420px;
    border-radius:12px;border:1px solid var(--wb-border);background:#fff;
    padding:12px 14px;box-shadow:var(--shadow-soft);
    transition:all .2s;text-align:left;margin-top:8px;
    animation:msgIn .35s cubic-bezier(.3,1.4,.5,1) both;
}
.prod-card:hover{border-color:rgba(59,91,254,.4);box-shadow:var(--shadow-card);transform:translateY(-2px)}
.prod-icon{
    width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;border:1px solid var(--wb-border);background:#fff;
}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:13.5px;font-weight:500;color:var(--wb-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-type{font-size:11px;color:var(--wb-sub);margin-top:1px}
.prod-arrow{color:var(--wb-sub);flex-shrink:0;font-size:14px;transition:color .2s}
.prod-card:hover .prod-arrow{color:var(--wb-brand)}

/* transition 黄色提示 */
.ai-transition{
    margin-top:8px;display:flex;align-items:flex-start;gap:8px;border-radius:12px;
    background:#FFF7E6;border:1px solid rgba(255,226,168,.8);
    padding:10px 14px;font-size:12.5px;color:#9B6E00;line-height:1.6;
    animation:msgIn .3s ease-out both;
}

/* ============ 聊天模式输入区 ============ */
.chat-input-wrap{flex-shrink:0;background:#fff;border-top:1px solid var(--wb-border);padding:12px 24px 14px}
.chat-input-box{max-width:800px;margin:0 auto}
.cib{
    display:flex;align-items:center;gap:8px;border:1px solid var(--wb-border);
    border-radius:14px;padding:8px 14px;background:#fff;transition:all .15s;
}
.cib.focus{border-color:var(--wb-brand);box-shadow:0 0 0 3px rgba(59,91,254,.08)}
.cib-plus{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--wb-sub);border-radius:6px;font-size:16px;flex-shrink:0}
.cib-plus:hover{background:var(--wb-bg);color:var(--wb-text)}
.cib-main{flex:1;min-width:0}
.cib-text{font-size:13.5px;color:var(--wb-text);min-height:20px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.cib-placeholder{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--wb-sub);flex-wrap:wrap}
.cib-placeholder .p-main{color:rgba(26,26,26,.8)}
.cib-placeholder .p-sep{color:rgba(138,143,153,.3)}
.cib-ph-btn{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--wb-sub)}
.cib-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cib-mcp{
    display:flex;align-items:center;gap:4px;font-size:12px;color:var(--wb-brand);
    background:rgba(59,91,254,.04);border:1px solid rgba(59,91,254,.15);
    padding:4px 8px;border-radius:7px;
}
.cib-model{font-size:12px;color:var(--wb-sub);padding:4px 6px}
.cib-send{
    width:34px;height:34px;border-radius:10px;background:var(--wb-text);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    transition:all .15s;flex-shrink:0;
}
.cib-send:hover{opacity:.9;transform:scale(1.05)}
.cib-send:disabled{background:#D1D5DB;cursor:not-allowed;transform:none}
.cib-footer{display:flex;align-items:center;gap:20px;margin-top:8px;padding:0 4px}
.cib-fbtn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--wb-sub)}
.cib-fbtn .fchk{width:14px;height:14px;border:1px solid var(--wb-border);border-radius:3px}
.cib-hint{margin-left:auto;font-size:11px;color:rgba(138,143,153,.6)}

/* ============ 抽屉 ============ */
.drawer{
    position:absolute;top:48px;right:0;bottom:0;width:400px;background:#fff;
    border-left:1px solid var(--wb-border);box-shadow:var(--shadow-card);z-index:40;
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .3s ease-out;
}
.drawer.open{transform:translateX(0)}
.dr-head{
    height:44px;flex-shrink:0;border-bottom:1px solid var(--wb-border);
    display:flex;align-items:center;gap:8px;padding:0 14px;
}
.dr-back{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--wb-sub);font-size:14px}
.dr-back:hover{background:var(--wb-bg);color:var(--wb-text)}
.dr-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dr-sub{font-size:11px;color:var(--wb-sub);flex-shrink:0}
.dr-body{flex:1;overflow-y:auto;background:var(--wb-bg);padding:12px}
.dr-body::-webkit-scrollbar{width:5px}
.dr-body::-webkit-scrollbar-thumb{background:#D8DADE;border-radius:3px}
.excel-sheet{border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);border:1px solid var(--wb-border);overflow:hidden;margin-bottom:12px}
.excel-title{padding:12px 16px;background:linear-gradient(135deg,#3B6FE0,#2C5BD2);color:#fff;font-size:14px;font-weight:600}
.excel-title small{display:block;font-size:11px;opacity:.9;font-weight:400;margin-top:2px}
.excel-table{width:100%;border-collapse:collapse;font-size:11px}
.excel-table th{background:#F8F9FB;font-weight:600;padding:6px 8px;border:1px solid var(--wb-border);text-align:left;white-space:nowrap}
.excel-table td{padding:6px 8px;border:1px solid var(--wb-border);color:var(--wb-text)}
.tag-ok{color:var(--wb-success);font-weight:500}
.tag-run{color:#F59E0B;font-weight:500}
.archive-card{border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);border:1px solid var(--wb-border);overflow:hidden;margin-bottom:12px}
.arc-head{padding:12px 16px;background:linear-gradient(135deg,#059669,#10B981);color:#fff}
.arc-head .t1{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.arc-head .t2{font-size:11px;opacity:.9;margin-top:2px}
.arc-rows{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.arc-row{display:flex;gap:8px;font-size:12px}
.arc-row .k{color:var(--wb-sub);width:64px;flex-shrink:0}
.arc-row .v{color:var(--wb-text);word-break:break-all}
.arc-row .v a{color:var(--wb-brand)}
.api-log{border-radius:10px;background:#1E293B;color:#E2E8F0;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;overflow-x:auto;white-space:pre}
.api-log .g{color:#34D399}.api-log .y{color:#FBBF24}.api-log .b{color:#93C5FD}

@media (max-width:1100px){.drawer{width:340px}.step-pill .sp-t{display:none}}
@media (max-width:860px){.sidebar{display:none}.drawer{width:100%}.hdr-demo{display:none}.mascot{display:none}}
</style>
</head>
<body>
<div class="app">

    <!-- 顶部 Header -->
    <div class="app-header">
        <div class="hdr-brand">
            <div class="brand-logo">W</div>
            <div class="brand-name">WorkBuddy</div>
            <span class="hdr-sep">/</span>
            <div class="hdr-demo">周报生成与归档演示</div>
        </div>
        <div class="hdr-steps" id="hdrSteps"></div>
        <div class="hdr-progress">
            <div class="pbar"><div class="pbar-fill" id="pbarFill" style="width:0%"></div></div>
            <span class="pnum" id="pnum">0 / 14</span>
        </div>
        <div class="hdr-ctrl">
            <button class="btn-ctrl btn-play" id="btnPlay" onclick="togglePlay()">
                <span id="playIcon">▶</span><span id="playText">自动播放</span>
            </button>
            <button class="btn-ctrl btn-next" id="btnNext" onclick="nextStep()">下一步 ›</button>
            <button class="btn-reset" id="btnReset" title="重置演示" onclick="resetAll()">↻</button>
        </div>
    </div>

    <div class="app-body">

        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sb-top">
                <div class="sb-lights"><span class="l1"></span><span class="l2"></span><span class="l3"></span></div>
                <div class="sb-spacer"></div>
                <div class="sb-icons">
                    <button title="搜索">⌕</button>
                    <button title="收起">◧</button>
                </div>
            </div>
            <div class="sb-ver">WorkBuddy v3.3.1</div>
            <div class="sb-nav">
                <button class="sb-nav-item"><span class="ni">＋</span><span class="nl">新建任务</span></button>
                <button class="sb-nav-item"><span class="ni">◈</span><span class="nl">助理</span><span class="beta">Beta</span></button>
                <button class="sb-nav-item"><span class="ni">▤</span><span class="nl">项目</span><span class="beta">Beta</span></button>
                <button class="sb-nav-item"><span class="ni">⚡</span><span class="nl">专家 · 技能 · 连接器</span><span class="beta">Beta</span></button>
                <button class="sb-nav-item"><span class="ni">↻</span><span class="nl">自动化</span></button>
                <button class="sb-nav-item"><span class="ni">···</span><span class="nl">更多</span><span class="hint">资料库 · 灵感</span></button>
            </div>
            <div class="sb-chats" id="sbChats"></div>
            <div class="sb-bottom">
                <button class="sb-bot-btn">▣ 新建本地域</button>
                <button class="sb-bot-btn green">↟ 更新日志</button>
                <button class="sb-bot-btn green">⬆ 是否升级</button>
            </div>
        </aside>

        <!-- 聊天主区 -->
        <main class="chat-main" id="chatMain">

            <!-- 欢迎主页（截图1） -->
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-title"><span class="wb-name">WorkBuddy</span><span class="wb-comma">,</span><span class="wb-rest"> 我帮你</span></div>
                <div class="welcome-tabs">
                    <div class="w-tab active"><span class="w-tab-dot"></span>日常办公</div>
                    <div class="w-tab">@ 代码开发</div>
                    <div class="w-tab">⚙ 设计创意</div>
                </div>
                <div class="welcome-cards">
                    <div class="w-card"><span class="w-card-icon">📄</span>文档处理</div>
                    <div class="w-card"><span class="w-card-icon">💰</span>金融服务</div>
                    <div class="w-card"><span class="w-card-icon">📊</span>数据分析与可视化</div>
                    <div class="w-card"><span class="w-card-icon">🔍</span>深度研究</div>
                    <div class="w-card"><span class="w-card-icon">🎬</span>视频生成</div>
                    <div class="w-card"><span class="w-card-icon">📽</span>幻灯片</div>
                    <div class="w-card"><span class="w-card-icon">🛠</span>产品管理</div>
                </div>
                <!-- 输入框（带打字机） -->
                <div class="welcome-input-wrap">
                    <div class="welcome-input" id="welcomeInput">
                        <button class="wi-tool" id="welcomePh">＋ 今天帮你做些什么？</button>
                        <span class="wi-sep">|</span>
                        <button class="wi-tool">＋ 引用对话文件</button>
                        <button class="wi-tool">※ 调用技能与指令</button>
                        <div class="welcome-input-right">
                            <button class="welcome-mcp">◇ MCP</button>
                            <span class="welcome-model">Z GLM-5.2 ⌄</span>
                            <button class="welcome-send" id="welcomeSend" onclick="sendCurrent()" title="发送">✈</button>
                        </div>
                    </div>
                    <div class="welcome-input-footer">
                        <button class="welcome-fbtn"><span class="wi-check"></span>选择工作空间 ⌄</button>
                        <button class="welcome-fbtn"><span class="wi-radio"></span>默认权限 ⌄</button>
                    </div>
                </div>
            </div>

            <!-- 聊天视图（初始隐藏） -->
            <div class="chat-hdr" id="chatHdr" style="display:none">
                <div class="dots" id="chatTabs"></div>
                <div class="c-sub" id="chatSub"></div>
            </div>
            <div class="chat-scroll" id="chatScroll" style="display:none">
                <div class="msg-list" id="msgList"></div>
            </div>
            <div class="chat-input-wrap" id="chatInputWrap" style="display:none">
                <div class="chat-input-box">
                    <div class="cib" id="cib">
                        <button class="cib-plus">＋</button>
                        <div class="cib-main">
                            <div class="cib-placeholder" id="cibPh">
                                <span class="p-main">今天帮你做些什么？</span>
                                <span class="p-sep">|</span>
                                <button class="cib-ph-btn">@ 引用对话文件</button>
                                <button class="cib-ph-btn">/ 调用技能与指令</button>
                            </div>
                            <div class="cib-text" id="cibText" style="display:none"></div>
                        </div>
                        <div class="cib-right">
                            <button class="cib-mcp">◇ MCP</button>
                            <span class="cib-model">Z GLM-5.3 ⌄</span>
                            <button class="cib-send" id="cibSend" onclick="sendCurrent()" title="发送">➤</button>
                        </div>
                    </div>
                    <div class="cib-footer">
                        <button class="cib-fbtn"><span class="fchk"></span>选择工作空间 ⌄</button>
                        <button class="cib-fbtn"><span class="fchk"></span>默认权限 ⌄</button>
                        <span class="cib-hint">Enter 发送 · Shift+Enter 换行</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 抽屉 -->
        <div class="drawer" id="drawer">
            <div class="dr-head">
                <button class="dr-back" onclick="closeDrawer()">‹</button>
                <div class="dr-title" id="drTitle">产物详情</div>
                <div class="dr-sub" id="drSub"></div>
            </div>
            <div class="dr-body" id="drBody"></div>
        </div>
    </div>
</div>
