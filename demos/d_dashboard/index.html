<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据概览 - 业务监控台</title>
<script src="assets/react.development.js"></script>
<script src="assets/react-dom.development.js"></script>
<script src="assets/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    min-height: 100vh;
  }

  /* 顶栏 */
  .topbar {
    background: #fff;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid #e8eaed;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
  }
  .topbar-title {
    font-size: 16px;
    font-weight: 600;
    color: #1e293b;
  }
  .topbar-breadcrumb {
    font-size: 13px;
    color: #94a3b8;
  }
  .topbar-breadcrumb span { color: #1e293b; }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  /* 布局 */
  .layout {
    display: flex;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* 侧边栏 */
  .sidebar {
    width: 220px;
    min-height: calc(100vh - 56px);
    background: #fff;
    border-right: 1px solid #e8eaed;
    padding: 20px 0;
    flex-shrink: 0;
  }
  .nav-section { margin-bottom: 24px; }
  .nav-label {
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 20px;
    margin-bottom: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 14px;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: #f8fafc; color: #1e293b; }
  .nav-item.active {
    background: #eff6ff;
    color: #2563eb;
    border-left-color: #2563eb;
    font-weight: 500;
  }
  .nav-icon { width: 18px; text-align: center; font-size: 15px; }

  /* 主内容区 */
  .main {
    flex: 1;
    padding: 24px 28px;
    min-width: 0;
  }

  /* 页面标题 */
  .page-header {
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 4px;
  }
  .page-desc {
    font-size: 13px;
    color: #94a3b8;
  }

  /* 统计卡片 */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 22px;
    border: 1px solid #e8eaed;
    transition: all 0.2s;
  }
  .stat-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    border-color: #d1d5db;
  }
  .stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .stat-label {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }
  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
  }
  .icon-blue { background: #eff6ff; }
  .icon-purple { background: #f5f3ff; }
  .icon-green { background: #ecfdf5; }
  .icon-orange { background: #fff7ed; }
  .stat-value {
    font-size: 30px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .stat-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .trend-up { color: #059669; font-weight: 600; display: flex; align-items: center; gap: 3px; }
  .trend-down { color: #dc2626; font-weight: 600; display: flex; align-items: center; gap: 3px; }
  .trend-sub { color: #94a3b8; }

  /* 图表区域 */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8eaed;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #f1f5f9;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
  }
  .card-actions {
    display: flex;
    gap: 4px;
  }
  .chip {
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    color: #64748b;
    background: transparent;
    font-family: inherit;
  }
  .chip:hover { background: #f8fafc; }
  .chip.active {
    background: #eff6ff;
    color: #2563eb;
    border-color: #bfdbfe;
    font-weight: 500;
  }
  .card-body { padding: 16px 20px; }
  .chart-area { height: 300px; }

  /* 底部区域 */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
  }

  /* 表格 */
  .data-table {
    width: 100%;
    border-collapse: collapse;
  }
  .data-table th {
    text-align: left;
    padding: 11px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    border-bottom: 1px solid #f1f5f9;
    background: #fafbfc;
  }
  .data-table td {
    padding: 13px 14px;
    font-size: 13px;
    border-bottom: 1px solid #f8fafc;
    color: #334155;
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #fafbfc; }

  .order-id { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: #2563eb; }
  .amount-text { font-weight: 600; color: #0f172a; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-success { background: #ecfdf5; color: #059669; }
  .badge-warning { background: #fffbeb; color: #d97706; }
  .badge-danger { background: #fef2f2; color: #dc2626; }

  .progress-track {
    width: 72px;
    height: 5px;
    background: #e8eaed;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: #2563eb;
    transition: width 0.6s ease;
  }

  /* 环形图区域 */
  .donut-layout {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .donut-chart { width: 150px; height: 150px; flex-shrink: 0; }
  .legend-list { flex: 1; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid #f8fafc;
  }
  .legend-item:last-child { border-bottom: none; }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .legend-name { flex: 1; font-size: 13px; color: #475569; }
  .legend-value { font-size: 13px; font-weight: 600; color: #1e293b; }
  .legend-pct { font-size: 11px; color: #94a3b8; width: 36px; text-align: right; }

  /* 排行榜 */
  .rank-list { list-style: none; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f8fafc;
  }
  .rank-item:last-child { border-bottom: none; }
  .rank-num {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .num-1 { background: #fef3c7; color: #d97706; }
  .num-2 { background: #f1f5f9; color: #475569; }
  .num-3 { background: #fef2f2; color: #dc2626; }
  .num-n { background: #f8fafc; color: #94a3b8; }
  .rank-info { flex: 1; }
  .rank-name { font-size: 13px; font-weight: 500; color: #334155; }
  .rank-bar-wrap {
    height: 5px;
    background: #f1f5f9;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .rank-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
  }
  .rank-amount {
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.4s ease forwards; opacity: 0; }
</style>
</head>
